<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bowline tutorial diagram</title>
  <desc id="desc">Four step diagram showing a bowline tied into a fixed loop.</desc>
  <defs>
    <style>
      .bg{fill:#080b0f}.panel{fill:#11151b;stroke:#2b333d;stroke-width:2}.rope{fill:none;stroke:#6ec7ff;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.rope-edge{fill:none;stroke:#16202a;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#f97316;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#f6f7f8;font:700 34px Inter,Arial,sans-serif}.cap{fill:#b9c0ca;font:600 22px Inter,Arial,sans-serif}.num{fill:#f97316;font:800 28px Inter,Arial,sans-serif}.label{fill:#f8d5c0;font:700 19px Inter,Arial,sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#f97316"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="52" y="62" class="txt">Bowline</text>
  <text x="52" y="98" class="cap">A fixed loop: up through the loop, around the standing line, back down through the loop.</text>

  <g transform="translate(50 135)">
    <rect class="panel" width="520" height="245" rx="18"/>
    <text x="28" y="45" class="num">1</text><text x="66" y="45" class="cap">Make a small loop</text>
    <path class="rope-edge" d="M105 200c48-115 205-115 254 0"/>
    <path class="rope" d="M105 200c48-115 205-115 254 0"/>
    <path class="rope-edge" d="M235 200v-125"/>
    <path class="rope" d="M235 200v-125"/>
    <text x="300" y="206" class="label">working end</text>
  </g>

  <g transform="translate(630 135)">
    <rect class="panel" width="520" height="245" rx="18"/>
    <text x="28" y="45" class="num">2</text><text x="66" y="45" class="cap">Bring the end up through</text>
    <path class="rope-edge" d="M112 200c48-115 205-115 254 0"/>
    <path class="rope" d="M112 200c48-115 205-115 254 0"/>
    <path class="rope-edge" d="M242 210c0-56 0-86 0-140"/>
    <path class="rope" d="M242 210c0-56 0-86 0-140"/>
    <path class="arrow" marker-end="url(#arrow)" d="M206 178c0-48 8-75 34-100"/>
  </g>

  <g transform="translate(50 440)">
    <rect class="panel" width="520" height="245" rx="18"/>
    <text x="28" y="45" class="num">3</text><text x="66" y="45" class="cap">Go around the standing line</text>
    <path class="rope-edge" d="M112 200c48-115 205-115 254 0"/>
    <path class="rope" d="M112 200c48-115 205-115 254 0"/>
    <path class="rope-edge" d="M240 210c0-50 0-76 0-128c80-35 108 50 28 58"/>
    <path class="rope" d="M240 210c0-50 0-76 0-128c80-35 108 50 28 58"/>
    <text x="320" y="118" class="label">standing line</text>
  </g>

  <g transform="translate(630 440)">
    <rect class="panel" width="520" height="245" rx="18"/>
    <text x="28" y="45" class="num">4</text><text x="66" y="45" class="cap">Back through and dress the knot</text>
    <path class="rope-edge" d="M118 204c46-112 190-112 236 0"/>
    <path class="rope" d="M118 204c46-112 190-112 236 0"/>
    <path class="rope-edge" d="M236 204c0-47-8-78 15-96c50-38 102 14 50 50c-24 16-49 8-65-5c0 22 0 40 0 63"/>
    <path class="rope" d="M236 204c0-47-8-78 15-96c50-38 102 14 50 50c-24 16-49 8-65-5c0 22 0 40 0 63"/>
    <text x="120" y="224" class="label">fixed loop</text>
    <text x="260" y="224" class="label">tail</text>
  </g>
</svg>
