<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Fictional contour example</title><desc id="desc">Six concentric contours increase inward from six thousand to six thousand one hundred feet in twenty-foot intervals. Five intervals give one hundred feet of gain.</desc><rect width="1000" height="480" rx="20" fill="#f4f2e9"/><g font-family="Arial,sans-serif" fill="#203d32"><text x="45" y="48" font-size="28" font-weight="700">Count intervals, not just lines</text><circle cx="275" cy="265" r="190" fill="none" stroke="#637b58" stroke-width="3"/><text x="275" y="69" text-anchor="middle" font-size="17">6000</text><circle cx="275" cy="265" r="162" fill="none" stroke="#637b58" stroke-width="1.8"/><text x="275" y="97" text-anchor="middle" font-size="17">6020</text><circle cx="275" cy="265" r="134" fill="none" stroke="#637b58" stroke-width="1.8"/><text x="275" y="125" text-anchor="middle" font-size="17">6040</text><circle cx="275" cy="265" r="106" fill="none" stroke="#637b58" stroke-width="1.8"/><text x="275" y="153" text-anchor="middle" font-size="17">6060</text><circle cx="275" cy="265" r="78" fill="none" stroke="#637b58" stroke-width="1.8"/><text x="275" y="181" text-anchor="middle" font-size="17">6080</text><circle cx="275" cy="265" r="50" fill="none" stroke="#637b58" stroke-width="3"/><text x="275" y="209" text-anchor="middle" font-size="17">6100</text><text x="540" y="140" font-size="24" font-weight="700">Contour interval: 20 ft</text><text x="540" y="193" font-size="22">Start: 6,000 ft</text><text x="540" y="231" font-size="22">Finish: 6,100 ft</text><text x="540" y="284" font-size="26" font-weight="700">5 intervals × 20 ft = 100 ft</text><text x="540" y="342" font-size="20">Elevation increases inward here.</text><text x="540" y="380" font-size="20">This example does not depict a trail.</text><text x="540" y="428" font-size="18">Fictional teaching contours. Not for navigation.</text></g></svg>
