<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">One inch in sixteenths</title><desc id="desc">Sixteen equal intervals. The fifth tick after zero is five sixteenths. Example: twelve plus five sixteenths equals twelve and five sixteenths inches.</desc><rect width="1000" height="480" rx="20" fill="#f4f2e9"/><g font-family="Arial,sans-serif" fill="#203d32"><text x="60" y="65" font-size="30" font-weight="700">Read the whole inch, then the fraction</text><text x="60" y="105" font-size="21">Example scale: 16 equal intervals per inch</text><path d="M100 150H900" stroke="#203d32" stroke-width="3"/><path d="M100 150v100" stroke="#203d32" stroke-width="3"/><path d="M150 150v40" stroke="#203d32" stroke-width="2"/><path d="M200 150v60" stroke="#203d32" stroke-width="2"/><path d="M250 150v40" stroke="#203d32" stroke-width="2"/><path d="M300 150v80" stroke="#203d32" stroke-width="3"/><path d="M350 150v40" stroke="#203d32" stroke-width="2"/><path d="M400 150v60" stroke="#203d32" stroke-width="2"/><path d="M450 150v40" stroke="#203d32" stroke-width="2"/><path d="M500 150v100" stroke="#203d32" stroke-width="3"/><path d="M550 150v40" stroke="#203d32" stroke-width="2"/><path d="M600 150v60" stroke="#203d32" stroke-width="2"/><path d="M650 150v40" stroke="#203d32" stroke-width="2"/><path d="M700 150v80" stroke="#203d32" stroke-width="3"/><path d="M750 150v40" stroke="#203d32" stroke-width="2"/><path d="M800 150v60" stroke="#203d32" stroke-width="2"/><path d="M850 150v40" stroke="#203d32" stroke-width="2"/><path d="M900 150v100" stroke="#203d32" stroke-width="3"/><text x="100" y="293" text-anchor="middle" font-size="23">0</text><text x="300" y="293" text-anchor="middle" font-size="23">1/4</text><text x="500" y="293" text-anchor="middle" font-size="23">1/2</text><text x="700" y="293" text-anchor="middle" font-size="23">3/4</text><text x="900" y="293" text-anchor="middle" font-size="23">1 inch</text><path d="M350 340V259m-8 12 8-12 8 12" stroke="#ad541e" stroke-width="4" fill="none"/><text x="350" y="378" text-anchor="middle" font-size="26" fill="#ad541e" font-weight="700">5/16</text><text x="560" y="370" font-size="26">12 + 5/16 = 12 5/16 in</text><text x="60" y="439" font-size="19">A teaching scale, not a physical ruler. Screen size and zoom change its displayed length.</text></g></svg>
