<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Keep untreated and treated water separate</title><desc id="desc">Flow goes from the dirty source container through the appropriate treatment to a protected clean container. Untreated water must not touch the outlet, clean cap or container mouth.</desc><rect width="1000" height="480" rx="20" fill="#f4f2e9"/><g font-family="Arial,sans-serif" fill="#203d32"><text x="50" y="65" font-size="30" font-weight="700">Protect the clean side</text><rect x="50" y="145" width="245" height="150" rx="12" fill="#ead9c3"/><rect x="375" y="145" width="250" height="150" rx="12" fill="#e0e6d4"/><rect x="705" y="145" width="245" height="150" rx="12" fill="#d2e6e3"/><text x="172" y="200" text-anchor="middle" font-size="25" font-weight="700">Untreated</text><text x="172" y="242" text-anchor="middle" font-size="21">Source container</text><text x="500" y="200" text-anchor="middle" font-size="25" font-weight="700">Treatment</text><text x="500" y="242" text-anchor="middle" font-size="21">Match the hazards</text><text x="827" y="200" text-anchor="middle" font-size="25" font-weight="700">Protected clean</text><text x="827" y="242" text-anchor="middle" font-size="21">Outlet, cap, vessel</text><path d="M310 220H355l-12-9m12 9-12 9M640 220H685l-12-9m12 9-12 9" fill="none" stroke="#203d32" stroke-width="4"/><text x="50" y="355" font-size="23">Do not let untreated water drip onto the clean bottle mouth.</text><text x="50" y="397" font-size="23">Follow the device’s marked flow direction and treatment limits.</text><text x="50" y="445" font-size="18">Workflow diagram, not device plumbing. A filter alone may not address every hazard.</text></g></svg>
