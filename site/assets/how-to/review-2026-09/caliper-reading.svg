<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Read the caliper and measure through the bore center</title><desc id="desc">One point two hundred inches from the beam plus point zero three seven from the dial equals one point two three seven. In the bore cross-section the diameter through the center is greater than an off-center chord.</desc><rect width="1000" height="480" rx="20" fill="#f4f2e9"/><g font-family="Arial,sans-serif" fill="#203d32"><text x="50" y="60" font-size="29" font-weight="700">Two readings make one measurement</text><text x="65" y="120" font-size="22">Beam</text><text x="340" y="120" font-size="22">Dial</text><text x="650" y="120" font-size="22">Total</text><text x="65" y="173" font-size="43">1.200</text><text x="255" y="173" font-size="38">+</text><text x="340" y="173" font-size="43">.037</text><text x="550" y="173" font-size="38">=</text><text x="650" y="173" font-size="43" font-weight="700">1.237 in</text><path d="M50 208H950" stroke="#c1c9be"/><circle cx="205" cy="337" r="95" fill="none" stroke="#203d32" stroke-width="3"/><path d="M110 337H300" stroke="#203d32" stroke-width="5"/><circle cx="205" cy="337" r="5" fill="#203d32"/><path d="M129 280H281" stroke="#ad541e" stroke-width="4" stroke-dasharray="9 6"/><text x="355" y="278" font-size="25" font-weight="700">Inside diameter: span the center</text><text x="355" y="322" font-size="22">The off-center chord is shorter.</text><text x="355" y="359" font-size="22">Keep the jaws square to the bore axis.</text><text x="355" y="396" font-size="21">Groove width is a different measurement.</text><text x="50" y="455" font-size="18">Arithmetic assumes .100 in per revolution and .001 in graduations. Confirm your own instrument.</text></g></svg>
